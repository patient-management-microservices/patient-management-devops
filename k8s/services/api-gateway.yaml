apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: patient-management-k8s
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4005
      targetPort: 4005
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: patient-management-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/patient-management-microservices/api-gateway:feature-add-auth-service
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4005
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: API_GATEWAY_PORT
            - name: PATIENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: PATIENT_SERVICE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: AUTH_SERVICE_URL
          readinessProbe:
            tcpSocket:
              port: 4005
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4005
            initialDelaySeconds: 60
            periodSeconds: 20
