apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: patient-management-k8s
  labels:
    app: billing-service
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
    - name: http
      port: 4001
      targetPort: 4001
    - name: grpc
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: patient-management-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/patient-management-microservices/billing-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4001
            - name: grpc
              containerPort: 9001
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: BILLING_SERVICE_PORT
            - name: GRPC_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: patient-management-config
                  key: BILLING_GRPC_PORT
          readinessProbe:
            tcpSocket:
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4001
            initialDelaySeconds: 60
            periodSeconds: 20
